name: macOS GUI test

on:
  push:
    branches: [mac-gui-test]

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Allow software OpenGL renderer (CI VMs have no GPU) - test build only
        run: sed -i '' '/NSOpenGLPFAAccelerated,/d' dpf/dgl/src/pugl-upstream/src/mac_gl.m
      - name: Build (native arch)
        run: |
          make -j4
          make -C dpf/examples/Info clap
      - name: Build test host
        run: clang++ -std=c++17 -fobjc-arc -I test/inc test/mac_gui_host.mm -framework Cocoa -framework OpenGL -o mac_gui_host
      - name: Run GUI tests
        run: |
          sw_vers; uname -m; system_profiler SPDisplaysDataType | head -20
          T=${{ matrix.os }}
          echo "=== control"; ./mac_gui_host --control control-$T.png 2>&1 || true
          echo "=== ember";   ./mac_gui_host bin/EmberEQ.clap ember-$T.png 2>&1 || true
          echo "=== dpf info"; ./mac_gui_host dpf/bin/d_info.clap info-$T.png 2>&1 || true
          ls -la *.png
      - name: Upload results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ci-gui-test -R ${{ github.repository }} --prerelease --title "CI GUI test" --notes "Interner Test" --target ${{ github.sha }} 2>/dev/null || true
          gh release upload ci-gui-test -R ${{ github.repository }} --clobber *.png || true
